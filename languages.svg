<svg width="400" height="200" viewBox="0 0 400 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .card {
      fill: #0D0D1E;
      stroke: #7C3AED;
      stroke-width: 1.5;
      rx: 8;
    }
    .title { font: bold 16px 'Segoe UI', Ubuntu, Sans-Serif; fill: #C084FC; }
    .lang-name { font: 600 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #E2E8F0; }
    .lang-pct { font: bold 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #A78BFA; text-anchor: end; }
    .glow {
      filter: drop-shadow(0px 0px 4px rgba(124, 58, 237, 0.4));
    }
  </style>
  <rect class="card glow" width="398" height="198" x="1" y="1" />
  
  <text class="title" x="25" y="35">Language Breakdown (By Bytes)</text>
  
  <g transform="translate(25, 55)">
    
    <g transform="translate(0, 0)">
      <text class="lang-name" x="0" y="12">C</text>
      <rect x="110" y="4" width="200" height="8" rx="4" fill="#1E1B4B" />
      <rect x="110" y="4" width="158" height="8" rx="4" fill="#555555" />
      <text class="lang-pct" x="350" y="12">79.2%</text>
    </g>
    <g transform="translate(0, 25)">
      <text class="lang-name" x="0" y="12">Jupyter Notebook</text>
      <rect x="110" y="4" width="200" height="8" rx="4" fill="#1E1B4B" />
      <rect x="110" y="4" width="36" height="8" rx="4" fill="#DA5B0B" />
      <text class="lang-pct" x="350" y="12">18.1%</text>
    </g>
    <g transform="translate(0, 50)">
      <text class="lang-name" x="0" y="12">Python</text>
      <rect x="110" y="4" width="200" height="8" rx="4" fill="#1E1B4B" />
      <rect x="110" y="4" width="2" height="8" rx="4" fill="#3572A5" />
      <text class="lang-pct" x="350" y="12">1.4%</text>
    </g>
    <g transform="translate(0, 75)">
      <text class="lang-name" x="0" y="12">JavaScript</text>
      <rect x="110" y="4" width="200" height="8" rx="4" fill="#1E1B4B" />
      <rect x="110" y="4" width="2" height="8" rx="4" fill="#f1e05a" />
      <text class="lang-pct" x="350" y="12">1.2%</text>
    </g>
    <g transform="translate(0, 100)">
      <text class="lang-name" x="0" y="12">C++</text>
      <rect x="110" y="4" width="200" height="8" rx="4" fill="#1E1B4B" />
      <rect x="110" y="4" width="0" height="8" rx="4" fill="#f34b7d" />
      <text class="lang-pct" x="350" y="12">0.1%</text>
    </g>
  </g>
</svg>
